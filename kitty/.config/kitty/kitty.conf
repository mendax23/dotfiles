font_family      FiraCode Nerd Font
bold_font        auto
# FiraCode hat keine echte Kursive. Mit "auto" fällt neueres kitty (>=0.30) auf
# eine fremde Italic-Schrift zurück (Tab-Leiste/tmux-Statusbar wechselt plötzlich
# die Schriftart) - deshalb Italics fest auf FiraCode pinnen.
italic_font      FiraCode Nerd Font
bold_italic_font FiraCode Nerd Font Bold
font_size        12.5

include ./theme.conf

term xterm-256color

allow_remote_control yes

map ctrl+right move_word_right
map ctrl+left  move_word_left

copy_on_select yes
